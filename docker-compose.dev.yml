version: '3.9'

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: website-dev
    command: pnpm dev
    ports:
      - '3000:3000'
      - '9229:9229' # Debug port
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - NODE_OPTIONS=--inspect=0.0.0.0:9229
    env_file:
      - .env.local
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
